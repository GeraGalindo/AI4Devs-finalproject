name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Run the Playwright E2E suite (Chromium)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Credenciales de un PostgreSQL efímero de CI: no son secretos.
# DATABASE_URL hace de base "de desarrollo"; las pruebas de integración usan solo TEST_DATABASE_URL.
# NODE_ENV es obligatorio en el backend (DEV-003): los scripts test, test:integration y dev lo
# fijan, y los pasos que cargan la configuración lo declaran también de forma explícita.
env:
  DATABASE_URL: postgres://calicoach:calicoach@localhost:5432/calicoach
  TEST_DATABASE_URL: postgres://calicoach:calicoach@localhost:5432/calicoach_test

jobs:
  checks:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calicoach
          POSTGRES_PASSWORD: calicoach
          POSTGRES_DB: calicoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calicoach -d calicoach"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Falla con vulnerabilidades de severidad alta o crítica (incluye las dependencias de desarrollo).
      - name: Security audit (high and critical)
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        env:
          NODE_ENV: test
        run: npm test
      - name: Apply migrations (prisma migrate deploy)
        run: npm run db:migrate
      - name: Migration status
        run: npm run db:status
      - name: Schema drift check (does not cover manual CHECK constraints)
        run: npm run db:drift
      - name: Test database guard refuses the development database
        env:
          NODE_ENV: test
        run: |
          if TEST_DATABASE_URL="$DATABASE_URL" npm run test:integration > guard.log 2>&1; then
            echo "The guard accepted DATABASE_URL as the test database" && exit 1
          fi
          grep -q 'must end with _test' guard.log
      # Fila centinela en la base "de desarrollo": si las pruebas la tocaran (TRUNCATE), desaparecería.
      - name: Insert a sentinel row in the development database
        env:
          PGPASSWORD: calicoach
        run: >-
          psql -h localhost -U calicoach -d calicoach -v ON_ERROR_STOP=1 -c
          "INSERT INTO users (email, password_hash, timezone) VALUES ('sentinel@ci.invalid', 'n/a', 'UTC')"
      - name: Backend integration tests (PostgreSQL, calicoach_test)
        env:
          NODE_ENV: test
        run: npm run test:integration
      - name: Development database untouched by the tests
        env:
          PGPASSWORD: calicoach
        run: |
          rows=$(psql -h localhost -U calicoach -d calicoach -tAc "SELECT count(*) FROM users WHERE email = 'sentinel@ci.invalid'")
          echo "sentinel rows in calicoach: $rows"
          test "$rows" = "1"
      - name: Build
        run: npm run build

  # DEV-007: el E2E (registro real incluido) corre en cada PR y con workflow_dispatch. No se repite
  # en cada push a main: el código fusionado es el mismo que validó el PR.
  e2e:
    name: E2E (Chromium)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calicoach
          POSTGRES_PASSWORD: calicoach
          POSTGRES_DB: calicoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calicoach -d calicoach"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Base aislada calicoach_e2e: salvaguardas (nombre *_e2e, host local, distinta de
      # DATABASE_URL y TEST_DATABASE_URL), creación y migraciones. `test:e2e` lo repite (idempotente).
      - name: Prepare the E2E database (calicoach_e2e)
        env:
          E2E_DATABASE_URL: postgres://calicoach:calicoach@localhost:5432/calicoach_e2e
        run: npm run db:prepare --workspace e2e
      # Playwright arranca sus propios servidores (puertos dedicados, sin reutilizar) contra calicoach_e2e.
      - name: Playwright E2E
        env:
          E2E_DATABASE_URL: postgres://calicoach:calicoach@localhost:5432/calicoach_e2e
        run: npm run test:e2e
      - name: Development database untouched by the E2E
        env:
          PGPASSWORD: calicoach
        run: |
          tables=$(psql -h localhost -U calicoach -d calicoach -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          echo "tables in calicoach: $tables"
          test "$tables" = "0"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
